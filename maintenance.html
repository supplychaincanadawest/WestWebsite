<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Site Temporarily Unavailable · Supply Chain Canada — West</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ED1C24;
            --ink: #14161a;
            --muted: #5c636e;
            --bg: #ffffff;
            --card: #ffffff;
            --border: #e6e8ec;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #f2f4f7;
                --muted: #9aa2ad;
                --bg: #0d0f12;
                --card: #14171c;
                --border: #23272e;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.5;
        }
        .card {
            max-width: 560px;
            width: 100%;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
        }
        .bar {
            width: 56px;
            height: 5px;
            background: var(--red);
            border-radius: 3px;
            margin: 0 auto 28px;
        }
        .eyebrow {
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--red);
            margin-bottom: 14px;
        }
        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(1.9rem, 6vw, 2.8rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
            margin-bottom: 18px;
        }
        p {
            color: var(--muted);
            font-size: 1.05rem;
            margin: 0 auto 28px;
            max-width: 440px;
        }
        .cta {
            display: inline-block;
            background: var(--red);
            color: #fff;
            text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 14px 30px;
            border-radius: 10px;
            transition: opacity 0.15s ease;
        }
        .cta:hover { opacity: 0.88; }
        .foot {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .foot a { color: var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <div class="bar"></div>
        <div class="eyebrow">Supply Chain Canada — West</div>
        <h1>We're temporarily down</h1>
        <p>Our website is currently offline for maintenance. In the meantime, please visit Supply Chain Canada for the latest information.</p>
        <a class="cta" href="https://www.supplychaincanada.com">Visit supplychaincanada.com</a>
        <div class="foot">
            Questions? Email <a href="mailto:info.ab@supplychaincanada.com">info.ab@supplychaincanada.com</a>
        </div>
    </main>
</body>
</html>
